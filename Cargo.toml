[workspace]
resolver = "3"
members = ["crates/*", "examples"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akosidencio/agent-effects"
homepage = "https://github.com/akosidencio/agent-effects"
authors = ["Dennis Paler"]

[workspace.dependencies]
agent-effects = { path = "crates/agent-effects", version = "0.1.1" }
agent-effects-http = { path = "crates/agent-effects-http", version = "0.1.1" }
agent-effects-memory = { path = "crates/agent-effects-memory", version = "0.1.1" }
agent-effects-otel = { path = "crates/agent-effects-otel", version = "0.1.1" }
agent-effects-postgres = { path = "crates/agent-effects-postgres", version = "0.1.1" }
agent-effects-sqlite = { path = "crates/agent-effects-sqlite", version = "0.1.1" }
agent-effects-store = { path = "crates/agent-effects-store", version = "0.1.1" }

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v5", "v7", "serde"] }

serde_json = "1.0.151"
sha2 = "0.11.0"
# Each store crate adds its own driver feature (sqlite / postgres).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"

proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# The transition table reads better grouped by source state than merged.
match_same_arms = "allow"
