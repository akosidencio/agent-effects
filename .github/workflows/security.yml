name: Security

on:
  workflow_call:
  # New advisories appear without any change here: check the lockfile daily.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable install cargo-audit --version 0.22.2 --locked
      # Warnings (unmaintained, yanked) are reported; vulnerabilities fail.
      - run: cargo +stable audit --deny unsound
      - run: cargo +stable audit --file fuzz/Cargo.lock --deny unsound

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks 8.30.1 (history and working tree, redacted)
        run: |
          image=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          docker run --rm --network none -v "$PWD:/repo:ro" "$image" git /repo --redact --no-banner
          docker run --rm --network none -v "$PWD:/repo:ro" "$image" dir /repo --redact --no-banner

  fuzz:
    name: Fuzz smoke (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable nightly --profile minimal --no-self-update
      - run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Locked harness dependencies
        run: cargo +nightly metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Bounded campaigns (10 seconds per target)
        run: |
          for target in stored_records stored_text state_machine retry_delays; do
            cargo +nightly fuzz run "$target" -- -max_total_time=10 -timeout=2 -rss_limit_mb=1024
          done
