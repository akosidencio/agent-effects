[package]
name = "agent-effects-bench"
description = "Reproducible workload benchmarks for agent-effects; not published"
publish = false
version.workspace = true
edition.workspace = true
rust-version = "1.94"   # through the SQL stores (sqlx 0.9)
license.workspace = true

[[bin]]
name = "agent-effects-bench"
path = "src/main.rs"

[dependencies]
agent-effects.workspace = true
agent-effects-memory.workspace = true
agent-effects-postgres.workspace = true
agent-effects-sqlite.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
