[package]
name = "agent-effects"
description = "Reliable side-effect execution for AI agents and autonomous applications"
keywords = ["agents", "idempotency", "side-effects", "reliability", "recovery"]
categories = ["asynchronous", "development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test doubles (`testkit::FakeRemote`) for exercising failure handling.
testkit = []
# `fault::FaultInjector`: simulated crashes at chosen points, for recovery tests.
fault-injection = []

[dependencies]
agent-effects-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
# Enables the testkit for this crate's own integration tests.
agent-effects = { path = ".", features = ["testkit", "fault-injection"] }
agent-effects-memory.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
