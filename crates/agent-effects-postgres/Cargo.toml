[package]
name = "agent-effects-postgres"
description = "PostgreSQL store for agent-effects: database-clock leases, many workers on one database"
keywords = ["agents", "idempotency", "side-effects", "postgres"]
categories = ["asynchronous", "database"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version = "1.94"   # sqlx 0.9 requires it; the other crates stay at the workspace MSRV
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-effects-postgres"
authors.workspace = true

[dependencies]
agent-effects-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "time", "uuid", "json"] }
time.workspace = true

[dev-dependencies]
agent-effects = { workspace = true, features = ["testkit"] }
agent-effects-store = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
