[package]
name = "agent-effects-store"
description = "Storage contract for agent-effects: effect records, leases, the state machine and a backend conformance suite"
keywords = ["agents", "idempotency", "side-effects", "storage"]
categories = ["asynchronous", "database"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-effects-store"
authors.workspace = true

[features]
# Store conformance suite, for crates implementing `EffectStore`.
testkit = ["dep:tokio", "tokio/rt"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
