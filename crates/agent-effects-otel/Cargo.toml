[package]
name = "agent-effects-otel"
description = "OpenTelemetry metrics for agent-effects"
keywords = ["agents", "side-effects", "opentelemetry", "metrics"]
categories = ["asynchronous", "development-tools::debugging"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
agent-effects.workspace = true
opentelemetry = { version = "0.33.0", default-features = false, features = ["metrics"] }

[dev-dependencies]
agent-effects = { workspace = true, features = ["testkit"] }
# Also used by the doc example.
agent-effects-memory.workspace = true
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["metrics", "testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
