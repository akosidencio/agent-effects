<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Agent Effects: reliable agent actions in Rust</title><desc id="desc">Dark blue banner with a graph flowing from intent, to execution, to verified results, highlighting durable records, safe retries and crash recovery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080F22"/><stop offset=".58" stop-color="#0C1832"/><stop offset="1" stop-color="#15204A"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9F7BFF"/><stop offset="1" stop-color="#5874FF"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3BDBFA"/><stop offset="1" stop-color="#6F8EFF"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#2AC9B1"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#5869F6" stop-opacity=".20"/><stop offset="1" stop-color="#5869F6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6F94CB" stroke-opacity=".085" stroke-width="1"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow" x="-40%" y="-60%" width="200%" height="240%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#00091A" flood-opacity=".36"/></filter>
  <marker id="tip" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M1 1L5 3L1 5" stroke="#65DCF4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="540" fill="url(#bg)"/>
<rect width="1600" height="540" fill="url(#grid)"/>
