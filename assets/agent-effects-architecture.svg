<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc">
<title id="title">Agent Effects actual Rust runtime architecture</title><desc id="desc">Host applications authorize and submit actions to the Agent Effects runtime. The runtime checks identity, policy, persisted contracts, durable intent, leases, and safely performs actions against remote systems. It reconciles uncertain outcomes by verification, safe retry, or operator intervention. State is persisted in interchangeable stores, with recovery and observability.</desc>
