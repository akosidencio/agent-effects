# cargo-deny policy: run `cargo deny check` (CI does on every pull request).

[graph]
all-features = true

[advisories]
version = 2
# Yanked crates usually mean a broken or compromised release.
yanked = "deny"
# Each ignore says why it is acceptable and when it must be removed; keep the
# list in step with the `--ignore` flags of the cargo audit job.
ignore = [
    # Added 2026-11-17. C SQLite < 3.54 (CVE-2026-119375): a crafted .db +
    # -wal pair can return uninitialized memory. Local, needs attacker-written
    # files. The fix is libsqlite3-sys >= 0.39; sqlx 0.9.0 requires < 0.38, so
    # no lockfile change can apply it. REMOVE when an sqlx release allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "no fix through sqlx 0.9.0; local only; see SECURITY.md" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions cost build time, not safety; report them, do not fail.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
